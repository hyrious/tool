<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <script src="favicon.js"></script>
  <script src="theme.js"></script>
  <title>ANSI Escape</title>
  <style>
    .content {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      font-size: 15px;
    }
    .hint {
      font-size: 13px;
      opacity: .55;
      margin-bottom: 4px;
    }
    table.cheat {
      border-collapse: collapse;
      width: 100%;
      max-width: 900px;
    }
    .cheat th {
      text-align: left;
      font-weight: 600;
      font-size: 12px;
      letter-spacing: .1em;
      text-transform: uppercase;
      opacity: .55;
      padding: 8px 12px;
      border-bottom: 1px solid var(--front);
    }
    .cheat td {
      padding: 5px 12px;
      border-bottom: 1px solid var(--control);
    }
    .cheat tr:not(.group):hover td {
      background: var(--control);
    }
    tr.group td {
      padding: 28px 12px 6px;
      font-size: 12px;
      letter-spacing: .1em;
      text-transform: uppercase;
      opacity: .55;
      border-bottom: 1px solid var(--front);
    }
    tr.group:hover td {
      background: none;
    }
    .code {
      cursor: copy;
      white-space: pre;
      user-select: all;
    }
    .code:active {
      opacity: .6;
    }
    .ok {
      margin-left: 12px;
      font-size: 12px;
      color: var(--green);
      opacity: 0;
      transition: opacity .15s;
      user-select: none;
    }
    .code.copied .ok {
      opacity: 1;
    }
    .preview {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    /* fixed terminal surface so every ANSI color stays visible in both themes */
    .term {
      background: #17181c;
      color: #d6d6d6;
      padding: 2px 8px;
      border-radius: 3px;
      font-size: 13px;
      line-height: 1.6;
      white-space: pre;
    }
    .note {
      font-size: 12px;
      opacity: .5;
    }
    .blink {
      animation: blink 1s steps(1) infinite;
    }
    @keyframes blink {
      50% { opacity: 0; }
    }
    .mini {
      display: inline-grid;
      grid-template-columns: repeat(5, 10px);
      gap: 2px;
    }
    .mini i {
      width: 10px;
      height: 10px;
      border-radius: 1px;
      background: var(--control);
    }
    .mini i.on {
      background: var(--front);
    }
  </style>
</head>
<body>
  <h1 class="title">ANSI Escape Cheat Sheet</h1>

  <section class="content">
    <table class="cheat">
      <thead>
        <tr><th>Code</th><th>Preview</th></tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </section>

  <script>
    const ANSI = [
      ['0', '#55555f', '黑'], ['1', '#cd0000', '红'], ['2', '#00cd00', '绿'], ['3', '#cdcd00', '黄'],
      ['4', '#3b5bdb', '蓝'], ['5', '#cd00cd', '品红'], ['6', '#00a5a5', '青'], ['7', '#d6d6d6', '白'],
      ['8', '#7f7f7f', '亮黑'], ['9', '#ff2a2a', '亮红'], ['10', '#2aff2a', '亮绿'], ['11', '#ffff3f', '亮黄'],
      ['12', '#5c8cff', '亮蓝'], ['13', '#ff2aff', '亮品红'], ['14', '#2affff', '亮青'], ['15', '#ffffff', '亮白'],
    ]

    function xterm256(n) {
      if (n < 16) return ANSI[n][1]
      if (n < 232) {
        const v = [0, 95, 135, 175, 215, 255]
        const i = n - 16
        return '#' + [v[(i / 36) | 0], v[((i / 6) | 0) % 6], v[i % 6]].map(x => x.toString(16).padStart(2, '0')).join('')
      }
      const x = 8 + (n - 232) * 10
      return '#' + x.toString(16).padStart(2, '0').repeat(3)
    }

    function contrast(hex) {
      hex = hex.replace('#', '')
      const f = i => parseInt(hex.slice(i, i + 2), 16) / 255
      const [r, g, b] = [1, 3, 5].map(f).map(v => v <= .03928 ? v / 12.92 : ((v + .055) / 1.055) ** 2.4)
      return .2126 * r + .7152 * g + .0722 * b > .35 ? '#17181c' : '#f2f2f2'
    }

    const term = (style, text = 'Aa 文字') => `<span class="term" style="${style}">${text}</span>`
    const fg = hex => term(`color:${hex}`)
    const bg = hex => term(`background:${hex};color:${contrast(hex)}`)

    function mini(row, col) {
      const cells = []
      for (let r = 0; r < 3; r++) {
        for (let c = 0; c < 5; c++) cells.push(`<i class="${r === row && c === col ? 'on' : ''}"></i>`)
      }
      return `<span class="mini">${cells.join('')}</span>`
    }

    const rows = document.querySelector('#rows')

    function addGroup(title) {
      const tr = rows.insertRow()
      tr.className = 'group'
      const td = tr.insertCell()
      td.colSpan = 2
      td.textContent = title
    }

    function addRow(code, preview, note) {
      const tr = rows.insertRow()
      const a = tr.insertCell()
      a.className = 'code'
      a.dataset.code = code
      a.textContent = code
      a.insertAdjacentHTML('beforeend', '<span class="ok">已复制</span>')
      const b = tr.insertCell()
      const wrap = document.createElement('span')
      wrap.className = 'preview'
      wrap.innerHTML = preview
      if (note) {
        const n = document.createElement('span')
        n.className = 'note'
        n.textContent = note
        wrap.appendChild(n)
      }
      b.appendChild(wrap)
    }

    const esc = seq => '\\x1B[' + seq

    addGroup('样式 / SGR')

    const styles = [
      ['0', '', '', '恢复默认'],
      ['1', 'font-weight:700', '', '加粗'],
      ['2', 'opacity:.45', '', '变暗'],
      ['3', 'font-style:italic', '', '斜体'],
      ['4', 'text-decoration:underline', '', '下划线'],
      ['5', '', 'blink', '闪烁'],
      ['7', 'background:#d6d6d6;color:#17181c', '', '反显'],
      ['8', 'color:transparent', '', '隐藏（前景透明）'],
      ['9', 'text-decoration:line-through', '', '删除线'],
    ]
    for (const [code, style, klass, note] of styles) {
      const styleAttr = style ? ` style="${style}"` : ''
      addRow(esc(code + 'm'), `<span class="term ${klass}"${styleAttr}>Aa 文字</span>`, note)
    }

    addGroup('前景色')

    for (const [n, hex, name] of ANSI) {
      const code = Number(n) < 8 ? String(30 + Number(n)) : String(90 + Number(n) - 8)
      addRow(esc(code + 'm'), fg(hex), name)
    }

    addRow(esc('38;5;196m'), fg(xterm256(196)), '256 色：196 = 亮红')
    addRow(esc('38;2;255;135;0m'), fg('#ff8700'), '真彩色：r;g;b')
    addRow(esc('1;31m'), term('font-weight:700;color:#cd0000'), '组合：加粗 + 红')

    addGroup('背景色')

    for (const [n, hex, name] of ANSI) {
      const code = Number(n) < 8 ? String(40 + Number(n)) : String(100 + Number(n) - 8)
      addRow(esc(code + 'm'), bg(hex), name)
    }

    addRow(esc('48;5;33m'), bg(xterm256(33)), '256 色：33 = 蓝')
    addRow(esc('48;2;255;135;0m'), bg('#ff8700'), '真彩色：r;g;b')
    addRow(esc('31;44m'), term('color:#cd0000;background:#3b5bdb'), '组合：红字 + 蓝底')

    addGroup('光标移动')

    addRow(esc('A'), mini(0, 2), '上移 n 行')
    addRow(esc('B'), mini(2, 2), '下移 n 行')
    addRow(esc('C'), mini(1, 3), '右移 n 列')
    addRow(esc('D'), mini(1, 1), '左移 n 列')
    addRow(esc('E'), mini(2, 0), '移到下面第 n 行行首')
    addRow(esc('F'), mini(0, 2), '移到上面第 n 行（列不变）')
    addRow(esc('5G'), mini(1, 4), '移到第 n 列')
    addRow(esc('H'), mini(0, 0), '移到左上角')
    addRow(esc('2;3H'), mini(1, 2), '移到 行;列')
    addRow(esc('s'), '<span class="note">保存当前光标位置</span>')
    addRow(esc('u'), '<span class="note">回到保存的光标位置</span>')

    addGroup('擦除 / 其他')

    addRow(esc('2J'), mini(-1, -1), '清屏')
    addRow(esc('K'), mini(1, 2), '擦除光标到行尾')
    addRow(esc('2K'), mini(1, 2), '擦除整行')
    addRow(esc('?25l'), mini(-1, -1), '隐藏光标')
    addRow(esc('?25h'), mini(2, 2), '显示光标')

    rows.addEventListener('click', async (ev) => {
      const cell = ev.target.closest('.code')
      if (!cell) return
      const text = cell.dataset.code
      try {
        await navigator.clipboard.writeText(text)
      } catch {
        const ta = document.createElement('textarea')
        ta.value = text
        document.body.appendChild(ta)
        ta.select()
        document.execCommand('copy')
        ta.remove()
      }
      cell.classList.add('copied')
      clearTimeout(cell._timer)
      cell._timer = setTimeout(() => cell.classList.remove('copied'), 900)
    })
  </script>
</body>
</html>
