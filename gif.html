<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="favicon.js"></script>
    <script src="theme.js"></script>
    <title>GIF Viewer</title>
    <style>
        html {
            height: 100%;
            overflow: hidden;
        }
        body {
            height: 100%;
            display: flex;
            flex-flow: column nowrap;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            font-family: monospace;
            line-height: 2;
        }
        canvas {
            max-width: 100%;
            max-height: 100%;
            overflow: hidden;
        }
        .tip {
            user-select: none;
            pointer-events: none;
        }
        .progress {
            width: 90%;
        }
        .gallery-btn {
            position: fixed;
            inset: 1rem 1rem auto auto;
            background: none;
            border: none;
            padding: 1rem;
            cursor: pointer;
        }
        .gallery-btn:hover {
            color: hotpink;
        }
        .gallery-btn:active {
            color: red;
        }
        .gallery {
            position: fixed;
            inset: 0;
            padding: 1rem;
            display: flex;
            flex-flow: row wrap;
            gap: 1rem;
            overflow: scroll;
            background: rgba(0, 0, 0, .5);
        }
        .gallery > canvas {
            width: 12%;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <canvas></canvas>
    <span class="tip">Drag & Drop a GIF here.</span>
    <input id="progress" class="progress" type="range" style="display: none;">
    <label for="progress"></label>
    <article id="gallery" class="gallery" style="display: none"></article>
    <button id="galleryBtn" class="gallery-btn" title="gallery" style="display: none">𓃑</button>
    <script src="https://cdn.jsdelivr.net/npm/omggif@1.0.10/omggif.js"></script>
    <script src="gif-transfer.js"></script>
    <script>
        class GifViewer {
            constructor() {
                this.canvas = document.querySelector('canvas')
                this.context = this.canvas.getContext('2d')
                this.tip = document.querySelector('.tip')
                this.progress = document.querySelector('.progress')
                this.progressLabel = this.progress.nextElementSibling
                this.gallery = document.querySelector('#gallery')
                this.galleryButton = document.querySelector('#galleryBtn')
                this.cached = []
                this.showGallery = false

                this.bindEvents()
                this.loadTransfer()
            }

            bindEvents() {
                document.body.ondragover = event => event.preventDefault()
                document.body.ondrop = event => {
                    event.preventDefault()
                    const file = event.dataTransfer.files[0]
                    if (file) this.openFile(file)
                }
                this.progress.oninput = () => this.refresh()
                this.galleryButton.onclick = () => {
                    this.showGallery = !this.showGallery
                    this.gallery.style.display = this.showGallery ? '' : 'none'
                }
                this.gallery.onclick = event => {
                    const index = Number(event.target.dataset?.i)
                    if (Number.isInteger(index)) {
                        this.progress.value = String(index)
                        this.refresh()
                        this.galleryButton.click()
                    }
                }
            }

            async loadTransfer() {
                const url = new URL(location.href)
                const key = url.searchParams.get('transfer')
                if (!key) return

                this.tip.textContent = 'Loading transferred GIF...'
                try {
                    const record = await gifTransfer.take(key)
                    if (!record) throw new Error('The transferred GIF has expired or was already opened.')
                    url.searchParams.delete('transfer')
                    history.replaceState(null, '', url)
                    await this.openFile(record.blob, record.name)
                } catch (error) {
                    this.tip.textContent = error instanceof Error ? error.message : String(error)
                }
            }

            async openFile(file, name = file.name) {
                this.tip.textContent = 'decoding...'
                try {
                    const buffer = await file.arrayBuffer()
                    await this.decode(buffer, name)
                } catch (error) {
                    this.tip.textContent = error instanceof Error ? error.message : String(error)
                }
            }

            async decode(buffer, name) {
                const reader = new GifReader(new Uint8Array(buffer))
                this.tip.textContent = `${name ? `${name} · ` : ''}${reader.width} x ${reader.height}`
                this.canvas.width = reader.width
                this.canvas.height = reader.height
                Object.assign(this.progress, { min: 0, max: 0, step: 1, value: 0 })
                this.progress.style.display = ''
                this.galleryButton.style.display = ''
                this.gallery.style.display = 'none'
                this.gallery.textContent = ''
                this.showGallery = false
                this.cached = Array(reader.numFrames())

                // The current composited pixels are updated according to each frame's disposal mode.
                const pixels = this.context.createImageData(reader.width, reader.height)
                for (let index = 0; index < this.cached.length; index++) {
                    const info = reader.frameInfo(index)
                    const before = info.disposal == 3 ? new Uint8ClampedArray(pixels.data) : undefined
                    reader.decodeAndBlitFrameRGBA(index, pixels.data)
                    this.cached[index] = new ImageData(new Uint8ClampedArray(pixels.data), reader.width, reader.height)

                    const item = this.gallery.appendChild(document.createElement('canvas'))
                    item.dataset.i = String(index)
                    item.width = reader.width
                    item.height = reader.height
                    item.getContext('2d').putImageData(this.cached[index], 0, 0)

                    if (info.disposal == 2) {
                        for (let y = info.y; y < info.y + info.height; y++) {
                            const start = (y * reader.width + info.x) * 4
                            pixels.data.fill(0, start, start + info.width * 4)
                        }
                    } else if (info.disposal == 3) {
                        for (let y = info.y; y < info.y + info.height; y++) {
                            const start = (y * reader.width + info.x) * 4
                            pixels.data.set(before.subarray(start, start + info.width * 4), start)
                        }
                    }

                    this.progress.value = this.progress.max = index
                    this.refresh()
                    await new Promise(requestAnimationFrame)
                }
                this.progress.value = 0
                this.refresh()
            }

            refresh() {
                const index = Number(this.progress.value)
                const frame = this.cached[index]
                this.progressLabel.textContent = `${index + 1}/${Number(this.progress.max) + 1}`
                if (frame) this.context.putImageData(frame, 0, 0)
            }
        }

        new GifViewer()
    </script>
</body>
</html>
